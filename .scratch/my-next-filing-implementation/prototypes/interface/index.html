<!doctype html>
<!--
  THROWAWAY PROTOTYPE V2.
  Three Wise-derived structures using Substack's current color tokens.
  A: Account shell. B: Focused flow. C: Compact rail.
  Run: python3 -m http.server 4173 --directory .scratch/my-next-filing-implementation/prototypes/interface
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>My Next Filing interface prototype</title>
    <style>
      :root {
        color: #111111;
        background: #ffffff;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        font-synthesis: none;

        /* Current Substack tokens, read from substack.com on 29 Aug 2026. */
        --orange: #ff6719;
        --orange-dark: #ff5600;
        --white: #ffffff;
        --gray-1: #f0f0f0;
        --gray-2: #dddddd;
        --gray-3: #b7b7b7;
        --gray-4: #929292;
        --gray-5: #515151;
        --ink: #111111;
        --muted: #757575;
        --tertiary: #b6b6b6;
        --orange-rgb: 255, 103, 25;
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);

        /* Minor-third type scale, 1rem base × 1.2. */
        --type-xs: 0.694rem;
        --type-sm: 0.833rem;
        --type-base: 1rem;
        --type-1: 1.2rem;
        --type-2: 1.44rem;
        --type-3: 1.728rem;
        --type-4: 2.074rem;
        --type-5: 2.488rem;
        --type-6: 2.986rem;
        --type-7: 3.583rem;
        --type-8: 4.3rem;
        --type-9: 5.16rem;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--white);
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding-bottom: 106px;
        background: var(--white);
      }

      button,
      input,
      select {
        font: inherit;
      }

      button,
      summary,
      a {
        cursor: pointer;
      }

      button {
        color: inherit;
        border: 0;
      }

      a {
        color: inherit;
      }

      :focus-visible {
        outline: 3px solid var(--orange);
        outline-offset: 3px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .screen {
        min-height: calc(100vh - 106px);
      }

      body[data-input="pointer"] .screen {
        transition:
          opacity 160ms var(--ease-out),
          transform 160ms var(--ease-out);

        @starting-style {
          opacity: 0;
          transform: translateY(4px);
        }
      }

      body[data-input="pointer"] .pressable {
        transition: transform 130ms var(--ease-out);
      }

      body[data-input="pointer"] .pressable:active {
        transform: scale(0.97);
      }

      .brand {
        display: inline-flex;
        gap: 10px;
        align-items: center;
        font-size: 17px;
        font-weight: 850;
        letter-spacing: -0.035em;
        white-space: nowrap;
      }

      .brand-mark {
        position: relative;
        width: 18px;
        height: 22px;
        overflow: hidden;
        background: var(--orange);
        border-radius: 3px;
      }

      .brand-mark::after {
        position: absolute;
        right: -5px;
        bottom: -5px;
        width: 12px;
        height: 12px;
        content: "";
        background: var(--white);
        transform: rotate(45deg);
      }

      .display {
        margin: 0;
        color: var(--ink);
        font-size: clamp(var(--type-7), 9vw, var(--type-9));
        font-weight: 950;
        line-height: 0.84;
        letter-spacing: -0.075em;
        text-wrap: balance;
      }

      .display.compact {
        font-size: clamp(var(--type-6), 6vw, var(--type-8));
        line-height: 0.9;
      }

      .kicker {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: var(--type-sm);
        font-weight: 650;
        line-height: 1.4;
      }

      .plain-label {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: var(--type-sm);
        font-weight: 650;
        line-height: 1.4;
      }

      .lede {
        max-width: 620px;
        margin: 24px 0;
        color: var(--gray-5);
        font-size: 17px;
        line-height: 1.55;
      }

      .primary,
      .secondary,
      .quiet-button {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        min-height: 46px;
        padding: 0 18px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 760;
      }

      .primary {
        color: var(--white);
        background: var(--orange);
      }

      @media (hover: hover) and (pointer: fine) {
        .primary:hover {
          background: var(--orange-dark);
        }
      }

      .secondary {
        color: var(--ink);
        background: var(--gray-1);
      }

      .quiet-button {
        min-height: 38px;
        padding: 0 14px;
        color: var(--ink);
        background: var(--white);
        border: 1px solid var(--gray-2);
      }

      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      .public-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: 70px;
        padding: 0 max(24px, calc((100vw - 1240px) / 2));
        background: var(--white);
        border-bottom: 1px solid var(--gray-2);
      }

      .public-nav,
      .reference-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 22px;
        align-items: center;
      }

      .nav-link,
      .text-link {
        padding: 0;
        color: var(--gray-5);
        background: transparent;
        font-size: 13px;
        text-decoration: none;
      }

      .nav-link[aria-current="page"] {
        color: var(--ink);
        font-weight: 760;
      }

      .text-link {
        color: var(--ink);
        font-weight: 700;
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 4px;
      }

      .text-link.external::after {
        margin-left: 5px;
        content: "↗";
        font-size: 11px;
      }

      .icon {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
        stroke: currentColor;
        stroke-width: 1.8;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        width: 232px;
        min-height: calc(100vh - 106px);
        padding: 25px 20px 22px;
        background: var(--white);
        border-right: 1px solid var(--gray-2);
      }

      .side-nav {
        display: grid;
        gap: 4px;
        margin-top: 40px;
      }

      .side-link {
        display: flex;
        gap: 12px;
        align-items: center;
        width: 100%;
        min-height: 42px;
        padding: 0 12px;
        color: var(--gray-5);
        background: transparent;
        border-radius: 999px;
        font-size: 14px;
        text-align: left;
      }

      .side-link[aria-current="page"],
      .side-link[aria-current="step"] {
        color: var(--ink);
        background: var(--gray-1);
        font-weight: 760;
      }

      .side-link .count {
        display: grid;
        place-items: center;
        width: 22px;
        height: 22px;
        margin-left: auto;
        color: var(--white);
        background: var(--orange);
        border-radius: 50%;
        font-size: 11px;
      }

      .side-footer {
        display: grid;
        gap: 8px;
        margin-top: auto;
        padding-top: 24px;
      }

      .side-footer button {
        padding: 0;
        color: var(--muted);
        background: transparent;
        font-size: 12px;
        text-align: left;
      }

      .app-shell {
        display: grid;
        grid-template-columns: 232px minmax(0, 1fr);
      }

      .app-main {
        min-width: 0;
        padding: 34px clamp(24px, 5vw, 72px) 80px;
      }

      .main-inner {
        width: min(820px, 100%);
        margin: 0 auto;
      }

      .main-inner.narrow {
        width: min(590px, 100%);
      }

      .top-meta {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: center;
        margin-bottom: 52px;
        color: var(--muted);
        font-size: 12px;
      }

      .saved {
        display: inline-flex;
        gap: 7px;
        align-items: center;
      }

      .saved::before {
        width: 7px;
        height: 7px;
        content: "";
        background: var(--orange);
        border-radius: 50%;
      }

      .progress-line {
        height: 4px;
        margin: 18px 0 38px;
        overflow: hidden;
        background: var(--gray-1);
        border-radius: 999px;
      }

      .progress-line span {
        display: block;
        width: var(--progress, 14%);
        height: 100%;
        background: var(--orange);
        border-radius: inherit;
      }

      .field-stack {
        display: grid;
        gap: 22px;
      }

      .field-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      .field label,
      .field legend {
        padding: 0;
        color: var(--ink);
        font-size: 14px;
        font-weight: 720;
      }

      .field input,
      .field select {
        width: 100%;
        min-height: 52px;
        padding: 0 14px;
        color: var(--ink);
        background: var(--white);
        border: 1px solid var(--gray-3);
        border-radius: 10px;
      }

      .field input:focus,
      .field select:focus {
        border-color: var(--orange);
      }

      .field small,
      .help {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .checks {
        display: grid;
        gap: 9px;
        padding: 0;
        margin: 0;
        list-style: none;
      }

      .checks label {
        display: grid;
        grid-template-columns: 20px 1fr;
        gap: 10px;
        align-items: start;
        min-height: 40px;
        padding: 9px 10px;
        border: 1px solid var(--gray-2);
        border-radius: 9px;
        font-size: 14px;
        line-height: 1.45;
      }

      .checks input {
        width: 17px;
        height: 17px;
        margin: 2px 0 0;
        accent-color: var(--orange);
      }

      .form-actions {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-top: 30px;
        padding-top: 22px;
        border-top: 1px solid var(--gray-2);
      }

      .notice {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        margin-bottom: 24px;
        padding: 13px 15px;
        color: var(--gray-5);
        background: var(--gray-1);
        border-radius: 9px;
        font-size: 13px;
        line-height: 1.45;
      }

      .notice strong {
        color: var(--ink);
        white-space: nowrap;
      }

      .next-panel {
        padding: clamp(24px, 5vw, 44px);
        color: var(--white);
        background: var(--ink);
        border-radius: 18px;
      }

      .next-grid {
        display: grid;
        grid-template-columns: 150px minmax(0, 1fr);
        gap: 34px;
        align-items: start;
      }

      .date {
        display: grid;
        line-height: 0.9;
      }

      .date strong {
        color: var(--white);
        font-size: clamp(68px, 10vw, 104px);
        font-weight: 900;
        letter-spacing: -0.08em;
      }

      .date span {
        margin-top: 12px;
        color: var(--tertiary);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.12em;
      }

      .status {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 0 10px;
        color: var(--white);
        border: 1px solid var(--orange);
        border-radius: 999px;
        font-size: 11px;
        font-weight: 760;
      }

      .next-panel h2 {
        max-width: 520px;
        margin: 16px 0 10px;
        color: var(--white);
        font-size: clamp(var(--type-4), 5vw, var(--type-6));
        line-height: 0.95;
        letter-spacing: -0.05em;
      }

      .next-panel p {
        color: var(--gray-2);
        line-height: 1.5;
      }

      .next-panel .text-link {
        color: var(--white);
      }

      .metric-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1px;
        margin-top: 18px;
        overflow: hidden;
        background: var(--gray-2);
        border: 1px solid var(--gray-2);
        border-radius: 14px;
      }

      .metric {
        min-height: 156px;
        padding: 22px;
        background: var(--white);
      }

      .metric p,
      .metric h3 {
        margin: 0;
      }

      .metric .value {
        margin: 16px 0 8px;
        color: var(--ink);
        font-size: clamp(var(--type-4), 5vw, var(--type-6));
        font-weight: 850;
        letter-spacing: -0.055em;
      }

      .flat-list {
        margin-top: 34px;
        border-top: 1px solid var(--gray-2);
      }

      .flat-row {
        display: grid;
        grid-template-columns: 116px minmax(0, 1fr) auto;
        gap: 20px;
        align-items: start;
        padding: 20px 0;
        border-bottom: 1px solid var(--gray-2);
      }

      .flat-row time {
        color: var(--ink);
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }

      .flat-row h3,
      .flat-row p {
        margin: 0;
      }

      .flat-row h3 {
        margin-bottom: 5px;
        font-size: 16px;
      }

      .flat-row p {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .page-title {
        margin-bottom: 34px;
      }

      .page-title h1 {
        max-width: 660px;
        margin: 0;
        color: var(--ink);
        font-size: clamp(var(--type-5), 6vw, var(--type-7));
        line-height: 0.92;
        letter-spacing: -0.06em;
      }

      .page-title p {
        max-width: 570px;
        margin: 18px 0 0;
        color: var(--muted);
        line-height: 1.55;
      }

      .state-panel {
        width: min(610px, 100%);
        margin: 70px auto 0;
        padding: 32px;
        border: 1px solid var(--gray-2);
        border-radius: 16px;
      }

      .state-symbol {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        margin-bottom: 24px;
        color: var(--white);
        background: var(--orange);
        border-radius: 50%;
        font-weight: 850;
      }

      .state-panel h1 {
        margin: 0;
        font-size: clamp(var(--type-4), 6vw, var(--type-7));
        line-height: 0.96;
        letter-spacing: -0.055em;
      }

      .state-panel p {
        color: var(--muted);
        line-height: 1.55;
      }

      .reference-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 230px;
        gap: 54px;
      }

      .reference-copy h1 {
        margin: 0 0 22px;
        font-size: clamp(var(--type-5), 6vw, var(--type-7));
        line-height: 0.94;
        letter-spacing: -0.06em;
      }

      .reference-copy h2 {
        margin: 34px 0 10px;
        font-size: 20px;
      }

      .reference-copy p {
        color: var(--gray-5);
        line-height: 1.65;
      }

      .reference-aside {
        padding: 18px 0;
        border-top: 2px solid var(--ink);
      }

      .reference-aside strong,
      .reference-aside span {
        display: block;
      }

      .reference-aside span {
        margin-top: 5px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      /* Variant A: Wise-style account shell with one calm working column. */
      .a-landing-main {
        width: min(1240px, calc(100% - 48px));
        margin: 0 auto;
        padding: 72px 0 90px;
      }

      .a-hero {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(340px, 0.55fr);
        gap: clamp(40px, 8vw, 112px);
        align-items: center;
        min-height: 610px;
      }

      .a-demo {
        padding: 22px;
        background: var(--gray-1);
        border-radius: 22px;
      }

      .a-demo-top {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 34px;
        color: var(--muted);
        font-size: 12px;
      }

      .a-demo-date {
        padding: 28px;
        color: var(--white);
        background: var(--ink);
        border-radius: 16px;
      }

      .a-demo-date strong {
        display: block;
        font-size: var(--type-8);
        line-height: 0.9;
        letter-spacing: -0.075em;
      }

      .a-demo-date span {
        display: block;
        margin-top: 12px;
        color: var(--gray-3);
        font-size: 12px;
        letter-spacing: 0.1em;
      }

      .a-demo dl {
        margin: 18px 0 0;
      }

      .a-demo dl div {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 2px;
        border-bottom: 1px solid var(--gray-2);
      }

      .a-demo dt,
      .a-demo dd {
        margin: 0;
        font-size: 13px;
      }

      .a-demo dd {
        font-weight: 760;
      }

      .a-benefits {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1px;
        margin-top: 50px;
        background: var(--gray-2);
        border: 1px solid var(--gray-2);
        border-radius: 16px;
        overflow: hidden;
      }

      .a-benefits article {
        min-height: 176px;
        padding: 24px;
        background: var(--white);
      }

      .a-benefits b {
        display: block;
        margin-bottom: 34px;
        color: var(--orange);
        font-size: 12px;
      }

      .a-benefits h2,
      .a-benefits p {
        margin: 0;
      }

      .a-benefits h2 {
        margin-bottom: 8px;
        font-size: 18px;
      }

      .a-benefits p {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .a-step-nav {
        display: grid;
        gap: 2px;
        margin-top: 26px;
        padding-top: 20px;
        border-top: 1px solid var(--gray-2);
      }

      .a-step-nav .side-link {
        min-height: 35px;
        padding-left: 16px;
        font-size: 12px;
      }

      /* Variant B: Wise transfer flow, no application chrome during the task. */
      .flow-header {
        display: grid;
        grid-template-columns: 170px minmax(300px, 560px) 170px;
        gap: 24px;
        align-items: center;
        min-height: 72px;
        padding: 0 38px;
        border-bottom: 1px solid var(--gray-2);
      }

      .flow-progress {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0;
      }

      .flow-progress span {
        position: relative;
        padding-top: 14px;
        color: var(--gray-4);
        font-size: 11px;
        text-align: center;
      }

      .flow-progress span::before {
        position: absolute;
        top: 4px;
        right: 0;
        left: 0;
        height: 3px;
        content: "";
        background: var(--gray-2);
      }

      .flow-progress span.done,
      .flow-progress span.active {
        color: var(--ink);
        font-weight: 720;
      }

      .flow-progress span.done::before,
      .flow-progress span.active::before {
        background: var(--orange);
      }

      .flow-close {
        justify-self: end;
        width: 38px;
        height: 38px;
        background: var(--gray-1);
        border-radius: 50%;
        font-size: 22px;
      }

      .b-landing {
        width: min(1120px, calc(100% - 48px));
        margin: 0 auto;
        padding: 74px 0 92px;
        text-align: center;
      }

      .b-landing .display {
        max-width: 1040px;
        margin: 0 auto;
      }

      .b-landing .lede {
        margin-right: auto;
        margin-left: auto;
      }

      .b-landing .button-row {
        justify-content: center;
      }

      .b-preview {
        display: grid;
        grid-template-columns: 1fr 1fr;
        width: min(760px, 100%);
        margin: 64px auto 0;
        overflow: hidden;
        border: 1px solid var(--gray-2);
        border-radius: 18px;
        text-align: left;
      }

      .b-preview > div {
        min-height: 248px;
        padding: 28px;
      }

      .b-preview > div:first-child {
        color: var(--white);
        background: var(--orange);
      }

      .b-preview h2,
      .b-preview p {
        margin: 0;
      }

      .b-preview h2 {
        max-width: 280px;
        margin-top: 42px;
        font-size: var(--type-3);
        line-height: 1;
        letter-spacing: -0.045em;
      }

      .b-preview .amount {
        margin: 22px 0 4px;
        font-size: var(--type-5);
        font-weight: 850;
        letter-spacing: -0.055em;
      }

      .flow-main {
        width: min(620px, calc(100% - 40px));
        margin: 0 auto;
        padding: 64px 0 90px;
      }

      .flow-main .page-title {
        text-align: center;
      }

      .flow-main .page-title h1 {
        font-size: var(--type-6);
      }

      .flow-main .page-title p {
        margin-right: auto;
        margin-left: auto;
      }

      .flow-main .next-panel {
        padding: 30px;
      }

      .flow-main .next-panel h2 {
        font-size: var(--type-5);
      }

      .flow-main .next-grid {
        grid-template-columns: 1fr;
      }

      .flow-summary {
        margin-top: 28px;
        border-top: 1px solid var(--gray-2);
      }

  <body data-input="keyboard">
    <div id="app"></div>

    <div class="prototype-controls" aria-label="Prototype controls">

      <label class="sr-only" for="screen-select">Screen</label>

        <option value="landing">Landing</option>
        <option value="check">Questionnaire</option>
        <option value="plan">Plan</option>
        <option value="methodology">Methodology</option>
        <option value="sources">Sources</option>

      <label class="sr-only" for="state-select">Result or storage state</label>

        <option value="unsupported">Unsupported</option>
        <option value="stale">Stale rules</option>

        <option value="corrupt">Corrupt saved data</option>
        <option value="storage">Storage unavailable</option>
        <option value="saved">Saved profile</option>

    </div>

    <script>
      const variants = ["A", "B", "C"];
      const variantNames = {
        A: "Account shell",
        B: "Focused flow",
        C: "Compact rail",
      };
      const screens = new Set([
        "landing",
        "check",
        "plan",
        "methodology",
        "sources",
        "privacy",
        "disclaimer",
        "notfound",
      ]);
      const states = new Set([
        "supported",
        "unsupported",
        "stale",
        "empty",
        "corrupt",
        "storage",
        "saved",
      ]);

      const groups = [
        ["about", "About you", "6 checks"],
        ["receipts", "Professional receipts", "₹19 lakh"],
        ["interest", "Bank interest", "₹10,000"],
        ["credits", "Credits and payments", "₹40,000 TDS"],
        ["gst", "GST check", "Maharashtra"],
        ["unsupported", "Unsupported facts", "None"],
        ["review", "Review", "Confirm"],
      ];

      const profileChecks = [
        "I am a resident individual.",
        "I use the new tax regime.",
        "I provide IT or software consulting.",
        "I use the presumptive method for professional income.",
        "I work directly for clients in India.",
        "I do not have a GSTIN.",
      ];

      const unsupportedChecks = [
        "Salary, house-property, dividend, or gift income",
        "Capital gains, crypto, lottery, or gaming income",
        "Foreign income or foreign-tax relief",
        "A deduction, loss, or disputed tax credit",
        "Another business, foreign client, or platform income",
        "Goods sales, employees, or an audit requirement",
      ];

      const icons = {
        home: '<svg class="icon" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
        check: '<svg class="icon" viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="m8 12 2.5 2.5L16 9"/></svg>',
        plan: '<svg class="icon" viewBox="0 0 24 24"><path d="M6 3v3M18 3v3M4 8h16v12H4z"/><path d="M8 12h3M8 16h7"/></svg>',
        book: '<svg class="icon" viewBox="0 0 24 24"><path d="M4 5a3 3 0 0 1 3-3h13v17H7a3 3 0 0 0-3 3z"/><path d="M4 5v17"/></svg>',
        source: '<svg class="icon" viewBox="0 0 24 24"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v5h5M10 12h6M10 16h6"/></svg>',
        lock: '<svg class="icon" viewBox="0 0 24 24"><path d="M6 10h12v11H6zM8 10V7a4 4 0 0 1 8 0v3"/></svg>',
      };

      function stateFromUrl() {
        const query = new URLSearchParams(location.search);
        const variant = variants.includes(query.get("variant")) ? query.get("variant") : "B";
        const screen = screens.has(query.get("screen")) ? query.get("screen") : "landing";
        const state = states.has(query.get("state")) ? query.get("state") : "supported";
        const group = groups.some(([key]) => key === query.get("group")) ? query.get("group") : "about";
        return { variant, screen, state, group };
      }

      function updateUrl(changes) {
        const query = new URLSearchParams(location.search);
        Object.entries(changes).forEach(([key, value]) => query.set(key, value));
        history.replaceState(null, "", `${location.pathname}?${query}`);
        render();
      }

      function brand() {
        return '<div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>My Next Filing</span></div>';
      }

      function publicNav(active) {
        return `<nav class="public-nav" aria-label="Main navigation">
          ${[["methodology", "Methodology"], ["sources", "Sources"], ["privacy", "Privacy"], ["check", "Check my dates"]]
            .map(([screen, label], index) => `<button class="${index === 3 ? "primary" : "nav-link"} pressable" data-screen="${screen}" ${active === screen ? 'aria-current="page"' : ""}>${label}</button>`)
            .join("")}
        </nav>`;
      }

      function publicHeader(active) {
        return `<header class="public-header">${brand()}${publicNav(active)}</header>`;
      }

      function sideNavigation(active) {
        const links = [
          ["landing", "home", "Home"],
          ["check", "check", "Your check"],
          ["plan", "plan", "Your plan"],
          ["methodology", "book", "Methodology"],
          ["sources", "source", "Sources"],
        ];
        return `<nav class="side-nav" aria-label="Application navigation">${links
          .map(([screen, icon, label]) => `<button class="side-link pressable" data-screen="${screen}" ${active === screen ? 'aria-current="page"' : ""}>${icons[icon]}<span>${label}</span></button>`)
          .join("")}</nav>`;
      }

      function stepNavigation(activeGroup, compact = false) {
        return `<nav class="${compact ? "side-nav" : "a-step-nav"}" aria-label="Questionnaire groups">${groups
          .map(([key, title], index) => `<button class="side-link pressable" data-group="${key}" data-screen="check" ${activeGroup === key ? 'aria-current="step"' : ""}><span>${index + 1}. ${title}</span></button>`)
          .join("")}</nav>`;
      }

      function sidebar(active, group, includeSteps = false) {
        return `<aside class="sidebar">${brand()}${sideNavigation(active)}${includeSteps ? stepNavigation(group) : ""}<div class="side-footer"><button data-screen="privacy">Privacy</button><button data-screen="disclaimer">Product limits</button><button>Delete saved answers</button></div></aside>`;
      }

      function topMeta(state) {
        return `<div class="top-meta"><span>Income earned 1 Apr 2026 to 31 Mar 2027</span><span class="saved">${state === "storage" ? "Not saved" : "Saved in this browser"}</span></div>`;
      }

      function moneyField(id, label, value, help) {
        return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="text" inputmode="numeric" value="${value}" aria-describedby="${id}-help"><small id="${id}-help">${help}</small></div>`;
      }

      function checklist(items, checked = true) {
        return `<ul class="checks">${items.map((item) => `<li><label><input type="checkbox" ${checked ? "checked" : ""}><span>${item}</span></label></li>`).join("")}</ul>`;
      }

      function groupContent(group) {
        const content = {
          about: `${checklist(profileChecks)}<p class="help">This version supports only this profile. A failed confirmation returns an editable unsupported result.</p>`,
          receipts: `<div class="field-grid">${moneyField("gross", "Gross professional receipts", "₹19,00,000", "Do not subtract expenses or TDS.")}${moneyField("cash", "Receipts paid in cash", "₹0", "Include a cheque or draft that was not account-payee.")}</div>${moneyField("profit", "Higher expected profit", "₹14,00,000", "At least half of gross receipts. Keep the calculated amount if your profit is not higher.")}`,
          interest: moneyField("interest", "Taxable bank or deposit interest", "₹10,000", "Enter gross taxable interest before TDS. Enter zero if you have none."),
          credits: `<div class="field-grid">${moneyField("tds", "TDS already deducted", "₹40,000", "Use TDS already deducted, not expected TDS.")}${moneyField("tcs", "TCS already collected", "₹0", "Use TCS already available as a tax credit.")}</div>${moneyField("advance", "Advance tax already paid", "₹0", "Do not include self-assessment tax for another year.")}`,
          gst: `<div class="field-grid"><div class="field"><label for="state">State or Union territory</label><select id="state"><option>Maharashtra</option><option>Tripura</option></select><small>Select where you provide services.</small></div>${moneyField("turnover", "GST aggregate turnover for this PAN", "₹19,10,000", "Include taxable and exempt supplies before GST, including relevant interest.")}</div><div class="checks"><label><input type="radio" name="gst-completeness" checked><span>I confirm this is my complete GST aggregate turnover.</span></label><label><input type="radio" name="gst-completeness"><span>I cannot confirm this total.</span></label></div>`,
          unsupported: `${checklist(unsupportedChecks, false)}<p class="help">Select every item that applies. This version stops instead of guessing.</p>`,
          review: `<div class="notice"><strong>Your answers</strong><span>Resident individual · new regime · direct Indian clients · presumptive professional income · no GSTIN · no unsupported facts</span></div>${checklist(["I checked these answers. I understand that the result is general guidance and can be incomplete for my facts."], false)}`,
        };
        return content[group];
      }

      function stateNotice(state) {
        if (state === "storage") return '<div class="notice"><strong>Not saved</strong><span>Your browser blocked storage. You can finish this check, but your answers will disappear after refresh.</span></div>';
        if (state === "saved") return '<div class="notice"><strong>Saved locally</strong><span>Last changed 29 August 2026 at 1:42 AM. No account is connected.</span></div>';
        if (state === "corrupt") return '<div class="notice"><strong>Saved answers need a reset</strong><span>We could not read this browser\'s saved profile. Reset it to start a clean check.</span></div>';
        return "";
      }

      function formContent(group, state, centered = false) {
        const index = groups.findIndex(([key]) => key === group);
        const [, title, summary] = groups[index];
        const previous = groups[Math.max(0, index - 1)][0];
        const next = groups[Math.min(groups.length - 1, index + 1)][0];
        return `${stateNotice(state)}<section class="page-title" ${centered ? 'style="text-align:center"' : ""}><p class="kicker">Group ${index + 1} of 7 · ${summary}</p><h1>${title}</h1><p>${group === "about" ? "Confirm the supported profile together before entering amounts." : "Check the answer, then continue. Nothing is sent to a server."}</p></section><div class="progress-line" style="--progress:${((index + 1) / groups.length) * 100}%"><span></span></div><form class="field-stack">${groupContent(group)}<div class="form-actions"><button type="button" class="secondary pressable" data-group="${previous}">Back</button><button type="button" class="primary pressable" ${index === groups.length - 1 ? 'data-screen="plan"' : `data-group="${next}"`}>${index === groups.length - 1 ? "Calculate plan" : "Continue"}</button></div></form>`;
      }

      function planStop(state) {
        const states = {
          unsupported: ["!", "This version cannot calculate a reliable plan for this answer.", "You selected foreign clients. Export-of-service and GST place-of-supply rules sit outside this release. Your other answers remain editable.", "Change this answer", "check"],
          stale: ["↻", "The rules need a new review.", "The dataset expired, so calculation controls stay disabled. Official source links remain available.", "Open official sources", "sources"],
          empty: ["→", "Check your answers before opening a plan.", "No profile exists in this browser. Start the questionnaire or load the fictional example.", "Check my dates", "check"],
          corrupt: ["×", "Your saved answers could not be read.", "Reset the local copy to continue. No government account is connected.", "Reset saved answers", "check"],
        };
        const item = states[state];
        if (!item) return null;
        return `<section class="state-panel"><div class="state-symbol">${item[0]}</div><p class="kicker">Calculation stopped</p><h1>${item[1]}</h1><p>${item[2]}</p><button class="primary pressable" data-screen="${item[4]}">${item[3]}</button></section>`;
      }

      const disclaimer = '<div class="notice"><strong>Best effort</strong><span>This result uses your answers and rules verified on 29 August 2026. It is general guidance, not tax or legal advice. Verify before you file or pay.</span></div>';

      function sourceLinks() {
        return '<div class="reference-nav"><a class="text-link external" href="https://www.incometaxindia.gov.in/w/section-408-5" target="_blank" rel="noreferrer">Source</a><a class="text-link external" href="https://www.incometax.gov.in/iec/foportal/help/generate-challan-form" target="_blank" rel="noreferrer">How to do this</a></div>';
      }

      function planContent() {
        return `${disclaimer}<div class="page-title" style="margin-top:36px"><p class="kicker">Your next filing</p><h1>One action comes first.</h1></div><section class="next-panel"><div class="next-grid"><div class="date"><strong>15</strong><span>MAR · 2027</span></div><div><span class="status">Upcoming</span><h2>Pay estimated advance tax</h2><p>Advance tax can apply because your estimated tax after TDS and TCS is at least ₹10,000.</p>${sourceLinks()}</div></div></section><div class="metric-row"><article class="metric"><p class="kicker">Estimated remaining tax</p><p class="value">₹55,160</p><p class="help">The filed return controls the final amount.</p></article><article class="metric"><p class="kicker">GST starting threshold</p><p class="value">₹90,000 left</p><p class="help">Declared GST aggregate turnover: ₹19,10,000.</p></article></div><section class="flat-list" aria-label="Chronological agenda"><article class="flat-row"><time>15 Mar 2027</time><div><h3>Advance tax</h3><p>Normal due date. Completion remains unknown.</p></div><span class="status" style="color:var(--orange)">Upcoming</span></article><article class="flat-row"><time>31 Aug 2027</time><div><h3>Annual income-tax return</h3><p>The form stays unnamed until official publication and review.</p></div><span class="status" style="color:var(--orange)">Upcoming</span></article></section>`;
      }

      function referenceContent(screen) {
        const copy = {
          methodology: ["How this estimate works", "The application applies a versioned local rule dataset to your declared profile and the current date in India Standard Time.", "Calculation stages", "Professional income uses the higher of half of gross receipts or higher expected profit. Total income is rounded before slab tax. Credits are subtracted after cess."],
          sources: ["Sources and review dates", "Statutory sources establish the rule. Tutorials explain an external task and never become legal authority.", "Income tax", "Income-tax Act, 2025 as amended by Finance Act, 2026. Reviewed 29 August 2026."],
          privacy: ["Privacy", "Your profile stays in this browser. The application has no account, backend, database, or government connection.", "Analytics", "Production Analytics loads only after opt-in and receives sanitized page names, never questionnaire answers, money, or results."],
          disclaimer: ["Product limits", "My Next Filing gives general information and a best-effort estimate for one narrow profile and period.", "Your responsibility", "Rules, forms, portal behavior, and extensions can change. Verify filing and payment decisions."],

        return `<div class="reference-layout"><article class="reference-copy"><p class="kicker">Reference</p><h1>${copy[0]}</h1><p>${copy[1]}</p><h2>${copy[2]}</h2><p>${copy[3]}</p><button class="text-link pressable" data-screen="landing">Return home</button></article><aside class="reference-aside"><strong>Reviewed</strong><span>29 August 2026</span><strong style="margin-top:20px">Applies to</strong><span>Income earned from 1 April 2026 to 31 March 2027</span></aside></div>`;
      }

      function renderA({ screen, state, group }) {
        if (screen === "landing") {
          return `<div class="screen">${publicHeader(screen)}<main class="a-landing-main"><section class="a-hero"><div><p class="kicker">A quiet compliance check for one narrow profile</p><h1 class="display">KNOW WHAT COMES NEXT.</h1><p class="lede">See an estimated tax amount, the next normal deadline, your annual return date, and a GST threshold status. No account. No reminder noise.</p><div class="button-row"><button class="primary pressable" data-screen="check">Check my dates</button><button class="secondary pressable" data-screen="plan" data-state="supported">Try an example</button></div></div><aside class="a-demo"><div class="a-demo-top"><span>Fictional example</span><span>Tax Year 2026-27</span></div><div class="a-demo-date"><strong>15</strong><span>MARCH 2027 · ADVANCE TAX</span></div><dl><div><dt>Estimated remaining tax</dt><dd>₹55,160</dd></div><div><dt>GST threshold room</dt><dd>₹90,000</dd></div><div><dt>Rules reviewed</dt><dd>29 Aug 2026</dd></div></dl></aside></section><section class="a-benefits"><article><b>01</b><h2>One supported profile</h2><p>Unsupported facts stop the estimate instead of widening it.</p></article><article><b>02</b><h2>Browser only</h2><p>Your amounts stay on this device. No government system is connected.</p></article><article><b>03</b><h2>Sources beside results</h2><p>Every conclusion keeps its statutory authority close.</p></article></section></main></div>`;
        }
        const stop = screen === "plan" ? planStop(state) : null;
        const content = screen === "check" ? formContent(group, state) : screen === "plan" ? stop || planContent() : referenceContent(screen);
        return `<div class="screen app-shell">${sidebar(screen, group, screen === "check")}<main class="app-main"><div class="main-inner ${screen === "check" ? "narrow" : ""}">${topMeta(state)}${content}</div></main></div>`;
      }

      function flowHeader(screen) {
        return `<header class="flow-header">${brand()}<div class="flow-progress"><span class="done">Profile</span><span class="${screen === "check" ? "active" : "done"}">Amounts</span><span class="${screen === "plan" ? "active" : ""}">Review</span><span>Plan</span></div><button class="flow-close pressable" data-screen="landing" aria-label="Close">×</button></header>`;
      }

      function renderB({ screen, state, group }) {
        if (screen === "landing") {
          return `<div class="screen">${publicHeader(screen)}<main class="b-landing"><p class="kicker">Income earned 1 Apr 2026 to 31 Mar 2027</p><h1 class="display">A SIMPLE WAY TO SEE YOUR NEXT FILING.</h1><p class="lede">A browser-only estimate for GST-unregistered resident IT consultants working directly for clients in India.</p><div class="button-row"><button class="primary pressable" data-screen="check">Check my dates</button><button class="secondary pressable" data-screen="plan" data-state="supported">Try the fictional example</button></div><section class="b-preview"><div><p class="kicker" style="color:#fff">Next normal date</p><h2>Advance tax can apply</h2><p style="margin-top:18px">15 March 2027</p></div><div><p class="kicker">Estimated remaining</p><p class="amount">₹55,160</p><p class="help">After actual TDS and TCS. Verify the portal amount before payment.</p></div></section></main></div>`;
        }
        if (["methodology", "sources", "privacy", "disclaimer", "notfound"].includes(screen)) {
          return `<div class="screen">${publicHeader(screen)}<main class="flow-main">${referenceContent(screen)}</main></div>`;
        }
        const stop = screen === "plan" ? planStop(state) : null;
        if (stop) return `<div class="screen">${flowHeader(screen)}<main class="flow-main">${stop}</main></div>`;
        if (screen === "check") return `<div class="screen">${flowHeader(screen)}<main class="flow-main">${formContent(group, state, true)}</main></div>`;
        return `<div class="screen">${flowHeader(screen)}<main class="flow-main">${disclaimer}<div class="page-title" style="margin-top:36px"><p class="kicker">Your next filing</p><h1>15 March 2027</h1><p>Advance tax can apply because the estimated liability after TDS and TCS is at least ₹10,000.</p></div><section class="next-panel"><div class="next-grid"><div><span class="status">Upcoming</span><h2>Pay estimated advance tax</h2><p>Estimated remaining amount: ₹55,160.</p>${sourceLinks()}</div></div></section><div class="flow-summary"><div><span>Professional income</span><strong>₹14,00,000</strong></div><div><span>Bank interest</span><strong>₹10,000</strong></div><div><span>Gross tax with cess</span><strong>₹95,160</strong></div><div><span>Actual TDS and TCS</span><strong>− ₹40,000</strong></div><div><span>GST threshold room</span><strong>₹90,000</strong></div></div></main></div>`;
      }

      function compactPrimaryNav(active) {
        const links = [["landing", "home", "Home"], ["check", "check", "Check"], ["plan", "plan", "Plan"], ["sources", "source", "Sources"]];
        return `<nav class="c-icon-nav" aria-label="Application navigation">${links.map(([screen, icon, label]) => `<button class="c-icon-button pressable" data-screen="${screen}" aria-label="${label}" title="${label}" ${active === screen ? 'aria-current="page"' : ""}>${icons[icon]}</button>`).join("")}</nav>`;
      }

      function contextRail(screen, group) {
        if (screen === "check") return `<aside class="c-context-rail"><h2>Your check</h2>${stepNavigation(group, true)}</aside>`;
        if (screen === "plan") return '<aside class="c-context-rail"><h2>Your plan</h2><nav class="side-nav"><button class="side-link" aria-current="page">Next action</button><button class="side-link">Tax estimate</button><button class="side-link">GST status</button><button class="side-link">Full agenda</button></nav></aside>';
        return `<aside class="c-context-rail"><h2>Information</h2><nav class="side-nav"><button class="side-link" data-screen="methodology">Methodology</button><button class="side-link" data-screen="sources">Sources</button><button class="side-link" data-screen="privacy">Privacy</button><button class="side-link" data-screen="disclaimer">Product limits</button></nav></aside>`;
      }

      function renderC({ screen, state, group }) {
        if (screen === "landing") {
          return `<div class="screen">${publicHeader(screen)}<main class="c-landing"><section class="c-hero"><div><p class="kicker">General guidance · calculated locally</p><h1 class="display">YOUR DATES. YOUR ANSWERS. ONE CLEAR PLAN.</h1></div><aside class="c-hero-aside"><p class="lede">For GST-unregistered resident IT consultants working directly for clients in India.</p><button class="primary pressable" data-screen="check">Check my dates</button><button class="secondary pressable" data-screen="plan" data-state="supported">Try an example</button></aside></section><section class="c-orange-strip"><div><strong>PRIVATE</strong><span>No account and no government connection.</span></div><div><strong>NARROW</strong><span>Unsupported facts stop the calculation.</span></div><div><strong>VERIFIABLE</strong><span>Sources and review dates stay beside the result.</span></div></section></main></div>`;
        }
        const stop = screen === "plan" ? planStop(state) : null;
        const content = screen === "check" ? formContent(group, state) : screen === "plan" ? stop || planContent() : referenceContent(screen);
        return `<div class="screen c-shell"><aside class="c-primary-rail"><span class="brand-mark" aria-hidden="true"></span>${compactPrimaryNav(screen)}</aside>${contextRail(screen, group)}<main class="c-main"><div class="main-inner ${screen === "check" ? "narrow" : ""}">${topMeta(state)}${content}</div></main></div>`;
      }

      function render() {
        const state = stateFromUrl();
        document.getElementById("app").innerHTML = state.variant === "A" ? renderA(state) : state.variant === "B" ? renderB(state) : renderC(state);
        document.getElementById("prototype-name").innerHTML = `${state.variant} · ${variantNames[state.variant]}<span>← → switches variants</span>`;
        document.getElementById("screen-select").value = state.screen;
        document.getElementById("state-select").value = state.state;
        document.title = `${variantNames[state.variant]} · ${state.screen} · My Next Filing prototype`;
        window.scrollTo({ top: 0, behavior: "instant" });
      }

      function cycleVariant(direction) {
        const current = variants.indexOf(stateFromUrl().variant);
        updateUrl({ variant: variants[(current + direction + variants.length) % variants.length] });
      }

      document.addEventListener("pointerdown", () => {
        document.body.dataset.input = "pointer";
      });

      document.addEventListener("keydown", (event) => {
        document.body.dataset.input = "keyboard";
        if (event.target.matches("input, textarea, select, [contenteditable]")) return;
        if (event.key === "ArrowLeft") {
          event.preventDefault();
          cycleVariant(-1);
        }
        if (event.key === "ArrowRight") {
          event.preventDefault();
          cycleVariant(1);
        }
      });

      document.addEventListener("click", (event) => {
        const target = event.target.closest("[data-screen], [data-state], [data-group]");
        if (!target) return;
        const changes = {};
        if (target.dataset.screen) changes.screen = target.dataset.screen;
        if (target.dataset.state) changes.state = target.dataset.state;
        if (target.dataset.group) changes.group = target.dataset.group;
        updateUrl(changes);
      });

      document.getElementById("previous-variant").addEventListener("click", () => cycleVariant(-1));
      document.getElementById("next-variant").addEventListener("click", () => cycleVariant(1));
      document.getElementById("screen-select").addEventListener("change", (event) => updateUrl({ screen: event.target.value }));
      document.getElementById("state-select").addEventListener("change", (event) => updateUrl({ state: event.target.value }));
      window.addEventListener("popstate", render);

      render();
    </script>
  </body>
</html>
